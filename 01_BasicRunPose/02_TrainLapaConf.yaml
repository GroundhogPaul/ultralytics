# train_config.yaml
task: pose
pretrained: false
model: ./ultralytics/cfg/models/11/yolo11n-pose.yaml
data: ./ultralytics/cfg/datasets/lapa8-pose.yaml

project: runs/Lapa
name: 128x

# Data Augmentation
imgsz: 128
translate: 0.3
scale: 0.9
degrees: 179.999
mosaic: 0.0
close_mosaic: -1

# training setting
single_cls: true
epochs: 21
batch: 16
device: '0'
workers: 1