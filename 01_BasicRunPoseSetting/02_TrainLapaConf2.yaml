# train_config.yaml
# for a second train simultaneously on another GPU
task: pose

project: runs/LapaTrain
name: 160x

# Data Augmentation
imgsz: 160
translate: 0.5
scale: 0.7
degrees: 179.999
mosaic: 1.0
close_mosaic: -1

# training setting
single_cls: true
epochs: 1000
batch: 128
device: '0'
workers: 0

## ----- scratch setting ----- ##
resume: false
pretrained: false
optimizer: 'SGD'
lr0: 0.01
lrf: 0.005
