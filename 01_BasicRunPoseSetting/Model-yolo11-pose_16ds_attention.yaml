# Ultralytics YOLO11-pose keypoints/pose estimation model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo11
# Task docs: https://docs.ultralytics.com/tasks/pose

# Parameters
nc: 80 # number of classes
kpt_shape: [17, 3] # number of keypoints, number of dims (2 for x,y or 3 for x,y,visible)
scales: # model compound scaling constants, i.e. 'model=yolo11n-pose.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6 # /16
  - [-1, 1, SPPF, [512, 5]] # 7 # 16
  - [-1, 2, C2PSA, [512]] # 8 # 16

# YOLO11n head
head:
  # - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  # - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  # - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 9 # / 8
  - [[-1, 4], 1, Concat, [1]] # 10 cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 11 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 12 # / 16
  - [[-1, 8], 1, Concat, [1]] # 13 cat head P4 # /16
  - [-1, 2, C3k2, [512, Ture]] # 14 (P4/16-medium) # 16

  - [[11, 14], 1, Pose, [nc, kpt_shape]] # Detect(P3, P4, P5)
